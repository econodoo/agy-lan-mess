name: Multi-OS Build & Release (Windows, Linux, macOS, Android, Web)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Analyze & Test (Protocol, Server, Client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Workspace Dependencies
        run: flutter pub get
      - name: Static Analysis
        run: |
          dart analyze packages/mesh_protocol packages/mesh_server
          cd apps/mesh_client && flutter analyze --no-fatal-infos
      - name: Run Protocol, Hub/MCP Integration & Widget Tests
        run: |
          (cd packages/mesh_protocol && dart test)
          (cd packages/mesh_server && dart test)
          (cd apps/mesh_client && flutter test)

  build-windows:
    name: Build Windows x64 (All-in-One Executable + Hub Server)
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Dependencies
        run: flutter pub get
      - name: Build Flutter Web Console
        working-directory: apps/mesh_client
        run: flutter build web --release
      - name: Build Flutter Windows Desktop App (agy-lan-mesh.exe)
        working-directory: apps/mesh_client
        run: flutter build windows --release
      - name: Compile Native Hub Server & Package Single-Folder Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows/apps/mesh_client/build | Out-Null
          Copy-Item -Recurse apps/mesh_client/build/windows/x64/runner/Release/* dist/windows/
          dart compile exe packages/mesh_server/bin/agy_mesh_server.dart -o dist/windows/agy-mesh-server.exe
          Copy-Item -Recurse scripts dist/windows/scripts
          Copy-Item -Recurse apps/mesh_client/build/web dist/windows/apps/mesh_client/build/web
          Copy-Item README.md dist/windows/
          Compress-Archive -Path dist/windows/* -DestinationPath agy-lan-mesh-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: agy-lan-mesh-windows-x64
          path: agy-lan-mesh-windows-x64.zip

  build-linux:
    name: Build Linux x64 & Web (All-in-One Executable + Hub Server + Web Console)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Desktop Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Dependencies
        run: flutter pub get
      - name: Build Flutter Web Console
        working-directory: apps/mesh_client
        run: flutter build web --release
      - name: Build Flutter Linux Desktop App (agy-lan-mesh)
        working-directory: apps/mesh_client
        run: flutter build linux --release
      - name: Compile Native Hub Server & Package Tarball
        run: |
          mkdir -p dist/linux/apps/mesh_client/build
          cp -r apps/mesh_client/build/linux/x64/release/bundle/* dist/linux/
          dart compile exe packages/mesh_server/bin/agy_mesh_server.dart -o dist/linux/agy-mesh-server
          cp -r scripts dist/linux/
          cp -r apps/mesh_client/build/web dist/linux/apps/mesh_client/build/web
          cp README.md dist/linux/
          tar -czf agy-lan-mesh-linux-x64.tar.gz -C dist/linux .
      - uses: actions/upload-artifact@v4
        with:
          name: agy-lan-mesh-linux-x64
          path: agy-lan-mesh-linux-x64.tar.gz

  build-macos:
    name: Build macOS (All-in-One App + Hub Server)
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Dependencies
        run: flutter pub get
      - name: Enable macOS Desktop Platform & LAN Entitlements
        run: |
          cd apps/mesh_client
          if [ ! -d macos ]; then
            flutter create --platforms=macos --no-pub .
          fi
          cat > macos/Runner/Release.entitlements << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.app-sandbox</key>
            <false/>
            <key>com.apple.security.network.client</key>
            <true/>
            <key>com.apple.security.network.server</key>
            <true/>
          </dict>
          </plist>
          EOF
          cp macos/Runner/Release.entitlements macos/Runner/DebugProfile.entitlements
          cd ../.. && flutter pub get
      - name: Build Flutter macOS App, Web Console & Native Hub Server
        run: |
          mkdir -p dist/macos/apps/mesh_client/build
          (cd apps/mesh_client && flutter build web --release)
          (cd apps/mesh_client && flutter build macos --release)
          dart compile exe packages/mesh_server/bin/agy_mesh_server.dart -o dist/macos/agy-mesh-server
          cp -r scripts dist/macos/
          cp -r apps/mesh_client/build/web dist/macos/apps/mesh_client/build/web
          cp -R apps/mesh_client/build/macos/Build/Products/Release/*.app dist/macos/
          cp README.md dist/macos/
          cd dist/macos && zip -r ../../agy-lan-mesh-macos.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: agy-lan-mesh-macos
          path: agy-lan-mesh-macos.zip

  build-android:
    name: Build Android APK
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Provision Android SDK & Accept Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          mkdir -p "$SDK_ROOT"
          CMDLINE_BIN="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          if [ -z "$CMDLINE_BIN" ]; then
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
            mkdir -p "$SDK_ROOT/cmdline-tools" /tmp/cmdtools_extract
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools_extract
            mv /tmp/cmdtools_extract/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            CMDLINE_BIN="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$CMDLINE_BIN" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$CMDLINE_BIN" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          yes | "$CMDLINE_BIN" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Dependencies & Build Release APK
        run: |
          flutter pub get
          cd apps/mesh_client
          rm -rf android
          flutter create --platforms=android --org com.agylan --project-name mesh_client --no-pub .
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"\/>\n    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"\/>\n    <application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="mesh_client"/android:label="AGY LAN Mesh"/' android/app/src/main/AndroidManifest.xml
          echo "org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError" >> android/gradle.properties
          flutter build apk --release 2>&1 | tee /tmp/apk_build.log || {
            tail -n 30 /tmp/apk_build.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
          cp build/app/outputs/flutter-apk/app-release.apk ../../agy-lan-mesh-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: agy-lan-mesh-android-apk
          path: agy-lan-mesh-android.apk

  release:
    name: Publish Multi-OS Release Assets
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.build-windows.result == 'success' && needs.build-linux.result == 'success' && needs.build-macos.result == 'success'
    needs: [build-windows, build-linux, build-macos, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release via gh CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          ls -lh release-assets/
          gh release create "$TAG" release-assets/* \
            --title "AGY LAN Mesh $TAG (Windows, macOS, Linux, Android)" \
            --generate-notes
